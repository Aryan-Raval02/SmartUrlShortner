spring:
  application:
    name: smarturlshortner

  datasource:
    url: jdbc:postgresql://localhost:5432/smarturlshortner
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
